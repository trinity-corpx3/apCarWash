# --- BASE DE DATOS ---
# Variables de entorno para Dockploy (con fallback para desarrollo local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/poserp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# --- LOYALTY (dual discount system) ---
# 7th visit: 100% discount (GRATIS)
loyalty.threshold=7
# 6th visit: 10% discount
loyalty.threshold.partial=6
# Para pruebas, permitir visitas consecutivas sin espera
loyalty.minMinutesBetweenVisits=0
loyalty.freeDiscountPercent=100

# --- LOGGING Y OTROS ---
logging.level.org.springframework.security=DEBUG
spring.main.allow-bean-definition-overriding=true

