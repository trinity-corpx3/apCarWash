<div class="main-bg">
  <div id="container-fluid" class="container-fluid">
    <h1 class="display-1 fw-bold main-title">Trinity</h1>
    <p id="top" class="lead main-subtitle">Trinity Platform</p> 
  </div>

  <div class="container mt-2 p-5">
    <div class="row">
      <div class="col-sm-1"></div>
      <div class="col-sm-4">
        <div class="sqr-primary-pos text-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-layout-text-window-reverse" viewBox="0 0 16 16">
            <path d="M13 6.5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 .5-.5m0 3a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 .5-.5m-.5 2.5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1 0-1z"/>
            <path d="M14 0a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zM2 1a1 1 0 0 0-1 1v1h14V2a1 1 0 0 0-1-1zM1 4v10a1 1 0 0 0 1 1h2V4zm4 0v11h9a1 1 0 0 0 1-1V4z"/>
          </svg>
          <br><br>
          <h3>Dashboard</h3>
          <p>Administra productos, stock y configuración de punto de venta.</p>
          <a id="white-button" [routerLink]="['/orders']" style="cursor: pointer;">Empezar</a>
        </div>
      </div>
      <div class="col-sm-2"></div>
      <div class="col-sm-4">
        <div class="sqr-primary-pos text-center" style="margin-left: auto; margin-right: 0;">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-bag" viewBox="0 0 16 16">
            <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>
          </svg>
          <br><br>
          <h3 class="h3-pos">Punto de Venta</h3>
          <p>Empieza a vender y a generar tickets.</p>
          <br>
          <a [routerLink]="['/pos']" id="white-button">Empezar</a>
        </div>
      </div>
      <div class="col-sm-1"></div>
    </div>
  </div>
</div>
